[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planagent"
version = "0.1.0"
description = "An auditable AI agent for scenario analysis and planning reports: tool use over real data, numeric-provenance guardrails, audit trail and evaluation harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir Masominia" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
aws = ["boto3>=1.34"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
planagent = "planagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
